# On a version tag, builds both images and pushes them to GitHub Container Registry:
#   ghcr.io/<owner>/7alm-backend:<tag>   ghcr.io/<owner>/7alm-web:<tag>
# Deploy with BACKEND_IMAGE / WEB_IMAGE set in .env.production.
name: Release images

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image names
        id: names
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "backend=ghcr.io/$owner/7alm-backend" >> "$GITHUB_OUTPUT"
          echo "web=ghcr.io/$owner/7alm-web" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ steps.names.outputs.backend }}:${{ github.ref_name }},${{ steps.names.outputs.backend }}:latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            BACKEND_URL=http://api:4000
            NEXT_PUBLIC_APP_URL=${{ vars.PUBLIC_APP_URL }}
          tags: ${{ steps.names.outputs.web }}:${{ github.ref_name }},${{ steps.names.outputs.web }}:latest
