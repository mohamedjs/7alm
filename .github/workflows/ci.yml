name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (NestJS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: halm
          POSTGRES_PASSWORD: halm
          POSTGRES_DB: halm
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U halm" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://halm:halm@localhost:5432/halm
      JWT_SECRET: ci-secret-ci-secret-ci-secret-ci-secret-0000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - name: Migrations apply cleanly
        run: npx prisma migrate deploy
      - run: npm run typecheck
      - name: Unit + architecture tests
        run: npm test
      - run: npx nest build

  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    env:
      BACKEND_URL: http://localhost:4000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx tsc --noEmit
      - name: Lint (reported, not yet blocking — pre-existing v1 findings)
        run: npx eslint src
        continue-on-error: true
      - run: npx next build

  images:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: 7alm-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: 7alm-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
