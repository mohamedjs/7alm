# 7alm — local development infrastructure.
#   docker compose up -d            → postgres, redis, kafka for `npm run start:dev`
#   docker compose --profile app up → also builds and runs api, worker and web
# Production uses docker-compose.prod.yml.
name: halm-dev

x-backend-env: &backend-env
  NODE_ENV: development
  DATABASE_URL: postgresql://halm:halm@postgres:5432/halm
  REDIS_URL: redis://redis:6379
  KAFKA_BROKERS: kafka:9092
  JWT_SECRET: dev-only-secret-change-me-0123456789abcdef
  SOCIAL_TOKEN_ENCRYPTION_KEY: dev-only-encryption-key
  REVIEW_TOKEN_SECRET: dev-only-review-secret
  SOCIAL_MOCK_MODE: "1"
  DEFAULT_SHIPPING_PROVIDER: test
  PUBLIC_APP_URL: http://localhost:3001
  CORS_ORIGINS: http://localhost:3001
  META_WEBHOOK_VERIFY_TOKEN: dev-verify-token
  META_APP_SECRET: dev-meta-app-secret
  UPLOAD_DIR: /data/uploads

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: halm
      POSTGRES_PASSWORD: halm
      POSTGRES_DB: halm
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U halm -d halm"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6380:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 168
    ports: ["9094:9094"]
    volumes: [kafkadata:/var/lib/kafka/data]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  migrate:
    profiles: [app]
    build: { context: ./backend }
    command: ["npx", "prisma", "migrate", "deploy"]
    environment: *backend-env
    depends_on:
      postgres: { condition: service_healthy }

  api:
    profiles: [app]
    build: { context: ./backend }
    environment: *backend-env
    ports: ["4000:4000"]
    volumes: [uploads:/data/uploads]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  worker:
    profiles: [app]
    build: { context: ./backend }
    command: ["node", "dist/worker.js"]
    environment: *backend-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }

  web:
    profiles: [app]
    build:
      context: .
      args:
        NEXT_PUBLIC_API_WS_URL: http://localhost:4000
    environment:
      BACKEND_URL: http://api:4000
    ports: ["3001:3000"]
    depends_on: [api]

volumes:
  pgdata:
  redisdata:
  kafkadata:
  uploads:
