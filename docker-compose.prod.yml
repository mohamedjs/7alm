# 7alm production stack — one VPS:
#   cp .env.production.example .env.production      # fill it in
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
# Only Caddy publishes ports (80/443). Everything else stays on the internal network.
name: halm

x-logging: &logging
  driver: json-file
  options: { max-size: "20m", max-file: "5" }

x-backend: &backend
  image: ${BACKEND_IMAGE:-7alm-backend:latest}
  build: { context: ./backend }
  env_file: .env.production
  environment:
    NODE_ENV: production
    DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    REDIS_URL: redis://redis:6379
    KAFKA_BROKERS: kafka:9092
    PUBLIC_APP_URL: https://${DOMAIN}
    CORS_ORIGINS: https://${DOMAIN}
    SOCIAL_OAUTH_REDIRECT_BASE: https://${DOMAIN}
    UPLOAD_DIR: /data/uploads
    COOKIE_SECURE: "1"
  restart: unless-stopped
  logging: *logging

services:
  caddy:
    image: caddy:2.10-alpine
    ports: ["${HTTP_PORT:-80}:80", "${HTTPS_PORT:-443}:443", "${HTTPS_PORT:-443}:443/udp"]
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web, api]
    restart: unless-stopped
    logging: *logging

  web:
    image: ${WEB_IMAGE:-7alm-web:latest}
    build:
      context: .
      args:
        BACKEND_URL: http://api:4000
        NEXT_PUBLIC_APP_URL: https://${DOMAIN}
        NEXT_PUBLIC_IPINFO_TOKEN: ${NEXT_PUBLIC_IPINFO_TOKEN:-}
    environment:
      BACKEND_URL: http://api:4000
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped
    logging: *logging

  migrate:
    <<: *backend
    command: ["npx", "prisma", "migrate", "deploy"]
    restart: "no"
    healthcheck: { disable: true }
    depends_on:
      postgres: { condition: service_healthy }

  api:
    <<: *backend
    volumes: [uploads:/data/uploads]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  worker:
    <<: *backend
    command: ["node", "dist/worker.js"]
    healthcheck: { disable: true }
    volumes: [uploads:/data/uploads]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    logging: *logging

  backup:
    image: postgres:17-alpine
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    entrypoint: ["/bin/sh", "/backup.sh"]
    volumes:
      - ./deploy/backup.sh:/backup.sh:ro
      - backups:/backups
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped
    logging: *logging

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    logging: *logging

  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes: [kafkadata:/var/lib/kafka/data]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
    restart: unless-stopped
    logging: *logging

volumes:
  pgdata:
  redisdata:
  kafkadata:
  uploads:
  backups:
  caddy_data:
  caddy_config:
