<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<title>7alm explainer stage, English (16:9, Notebook)</title>
<link rel="stylesheet" href="remixicon.css">
<style>
@font-face { font-family: Inter; src: url(fonts/inter-latin-400-normal.woff2); font-weight: 400; }
@font-face { font-family: Inter; src: url(fonts/inter-latin-800-normal.woff2); font-weight: 800; }
@font-face { font-family: Caveat; src: url(fonts/caveat-latin.woff2); font-weight: 400 700; }
:root { --paper: #F3EEE4; --paper2: #EAE3D5; --card: #FFFFFF; --ink: #1A1714; --mute: #6B6358; --line: #DCD3C2;
  --marker: #E2572B; --hl: #FFD84D; --good: #2F8F5B; --tape: rgba(255, 228, 140, .78);
  --shadow: 0 2px 0 rgba(26, 23, 20, .06), 0 22px 40px -20px rgba(70, 50, 25, .32); }
* { box-sizing: border-box; margin: 0; }
html, body { background: var(--paper); overflow: hidden; }
#stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; font-family: Inter, sans-serif; color: var(--ink); }
#bg { position: absolute; inset: 0; background-color: var(--paper); background-image: radial-gradient(rgba(26, 23, 20, .12) 2px, transparent 2.3px); background-size: 52px 52px; background-position: 26px 26px; }
.layer { position: absolute; inset: 0; display: none; }
.ri { line-height: 1; }
.hand { font-family: Caveat, cursive; font-weight: 700; }

/* paper card + tape */
.paper { position: relative; background: var(--card); border: 2px solid var(--ink); border-radius: 16px; box-shadow: var(--shadow); }
.tape { position: absolute; width: 120px; height: 34px; background: var(--tape); box-shadow: 0 1px 2px rgba(70, 50, 25, .15);
  clip-path: polygon(3% 0, 97% 4%, 100% 50%, 96% 100%, 2% 96%, 0 50%); }
.tape.tl { left: -30px; top: -14px; transform: rotate(-24deg); }
.tape.tr { right: -30px; top: -14px; transform: rotate(22deg); }
.tape.tc { left: 50%; top: -18px; margin-left: -60px; transform: rotate(-3deg); }

/* headings: handwritten kicker + title with a highlighter sweep */
.head { position: absolute; top: 50px; left: 96px; right: 96px; }
.head .kick { font-family: Caveat, cursive; font-weight: 700; font-size: 46px; color: var(--marker); display: flex; align-items: center; gap: 12px; transform: rotate(-1.5deg); transform-origin: left; }
.head .kick .ri { font-size: 40px; }
.head h2 { display: inline-block; position: relative; isolation: isolate; font-weight: 800; font-size: 68px; letter-spacing: -1.5px; line-height: 1.1; margin-top: 2px; white-space: nowrap; }
.head h2 .sw { position: absolute; left: -10px; bottom: 4px; height: 30px; width: calc(100% + 20px); background: var(--hl); border-radius: 6px 14px 8px 12px; z-index: -1; transform-origin: left; transform: scaleX(0) rotate(-.6deg); }
.head h2 span.t { position: relative; }

/* footage */
.frame { position: absolute; padding: 14px; background: var(--card); border: 2px solid var(--ink); border-radius: 22px; box-shadow: 0 46px 76px -28px rgba(70, 50, 25, .42); }
.frame .win { width: 100%; height: 100%; overflow: hidden; border-radius: 12px; background: #000; }
.frame img { width: 100%; height: 100%; object-fit: cover; display: block; }
.frame.screen { left: 96px; top: 238px; width: 1200px; height: 703px; }
.frame.phone { left: 260px; top: 210px; width: 448px; height: 790px; border-radius: 46px; padding: 14px; }
.frame.phone .win { border-radius: 34px; }
.side { position: absolute; left: 1380px; top: 300px; width: 450px; display: flex; flex-direction: column; gap: 34px; }
.phone ~ .side { left: 860px; width: 820px; top: 330px; }
.pt { display: flex; gap: 18px; align-items: flex-start; padding: 24px 28px 26px; font-weight: 800; font-size: 34px; line-height: 1.3; letter-spacing: -.4px; }
.pt .ri { font-size: 40px; color: var(--marker); margin-top: 0; flex: none; }
.note { position: absolute; padding: 18px 26px 22px; background: var(--hl); font-family: Caveat, cursive; font-weight: 700; font-size: 40px; line-height: 1.05; box-shadow: 0 18px 30px -16px rgba(70, 50, 25, .45); }

/* title / outro */
.logo { position: absolute; left: 50%; top: 120px; width: 1700px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; text-align: center; }
.logo img { width: 210px; height: 210px; border-radius: 52px; border: 3px solid var(--ink); box-shadow: 0 34px 56px -22px rgba(26, 23, 20, .38); }
.logo h1 { position: relative; font-weight: 800; font-size: 150px; letter-spacing: -5px; line-height: 1.05; margin-top: 18px; white-space: nowrap; }
.logo svg.ul { position: absolute; left: -20px; bottom: -14px; width: calc(100% + 40px); height: 44px; overflow: visible; }
.logo svg.ul path { fill: none; stroke: var(--marker); stroke-width: 11; stroke-linecap: round; }
.logo p { font-family: Caveat, cursive; font-weight: 700; font-size: 62px; color: var(--ink); margin-top: 26px; }
.tiles { position: absolute; left: 50%; top: 770px; width: 1800px; transform: translateX(-50%); display: flex; gap: 34px; justify-content: center; }
.tile { min-width: 220px; display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 26px 26px 20px; font-weight: 800; font-size: 30px; white-space: nowrap; }
.tile .ri { font-size: 56px; color: var(--marker); }
.url { position: absolute; left: 50%; top: 965px; transform: translateX(-50%); font-weight: 800; font-size: 34px; background: var(--ink); color: var(--paper); padding: 14px 36px 18px; border-radius: 999px; white-space: nowrap; }
.url .ri { color: var(--hl); margin-right: 14px; vertical-align: -5px; }
.credit { position: absolute; right: 70px; bottom: 34px; font-family: Caveat, cursive; font-weight: 700; font-size: 34px; color: var(--mute); transform: rotate(-1.5deg); }
.outro .logo { top: 70px; }
.outro .logo img { width: 170px; height: 170px; border-radius: 42px; }
.outro .logo h1 { font-size: 130px; }
.outro .tiles { top: 700px; }
.outro .url { top: 925px; }

/* bullets */
.grid { position: absolute; top: 290px; left: 120px; right: 120px; display: grid; grid-template-columns: 1fr 1fr; gap: 60px 70px; }
.card { display: flex; gap: 26px; align-items: center; padding: 36px 40px 38px; }
.card .ri { font-size: 66px; color: var(--marker); flex: none; }
.card b { display: block; font-weight: 800; font-size: 44px; letter-spacing: -.8px; }
.card small { display: block; font-family: Caveat, cursive; font-weight: 700; font-size: 42px; color: var(--mute); margin-top: 6px; line-height: 1.1; }
.card:nth-child(1) { transform: rotate(-.8deg); } .card:nth-child(2) { transform: rotate(.7deg); }
.card:nth-child(3) { transform: rotate(.5deg); } .card:nth-child(4) { transform: rotate(-.6deg); }
</style>
</head>
<body>
<div id="stage"><div id="bg"></div><div id="layers"></div></div>
<script>
const T = window.TIMING, B = T.brand || {};
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = x => 1 - Math.pow(1 - clamp(x), 3);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const ri = n => n ? `<i class="ri ${n.startsWith('ri-') ? n : 'ri-' + n + '-line'}"></i>` : '';
const tapes = ['tl', 'tr', 'tc'];
const head = s => s.title ? `<div class="head">${s.kicker ? `<div class="kick a0">${ri(s.icon)}${esc(s.kicker)}</div>` : ''}<h2 class="a0"><span class="sw"></span><span class="t">${esc(s.title)}</span></h2></div>` : '';
const L = document.getElementById('layers');
// a hand-drawn underline (slightly wavy), drawn on with stroke-dashoffset
const UL = '<svg class="ul" viewBox="0 0 400 40" preserveAspectRatio="none"><path pathLength="1" d="M6,26 C80,14 160,30 230,20 S350,12 394,22"/></svg>';

for (const s of T.scenes) {
  const el = document.createElement('div'); el.className = 'layer ' + s.type; el.id = 'S-' + s.id;
  if (s.type === 'title' || s.type === 'outro') el.innerHTML = `<div class="logo a0">${B.logo ? `<img src="${B.logo}">` : ''}<h1>${esc(s.title)}${UL}</h1><p>${esc(s.sub)}</p></div>
    <div class="tiles">${(s.tiles || []).map((t, i) => `<div class="tile paper a${i + 1}" style="rotate:${[-2, 1.5, -1, 2][i % 4]}deg"><span class="tape tc"></span>${ri(t.icon)}${esc(t.text)}</div>`).join('')}</div>
    ${s.url ? `<div class="url a9">${ri('global')}${esc(s.url)}</div>` : ''}${s.credit ? `<div class="credit a9">${esc(s.credit)}</div>` : ''}`;
  if (s.type === 'shot') el.innerHTML = `${head(s)}<div class="frame ${s.frame || 'screen'}"><span class="tape tl"></span><span class="tape tr"></span><div class="win"><img></div></div>
    <div class="side">${(s.points || []).map((p, i) => `<div class="pt paper a${i + 1}" style="rotate:${[-1, .8, -.5][i % 3]}deg"><span class="tape ${tapes[i % 2]}"></span>${ri(p.icon || 'checkbox-circle')}<span>${esc(p.text)}</span></div>`).join('')}</div>`;
  if (s.type === 'bullets') el.innerHTML = `${head(s)}<div class="grid">${(s.items || []).map((t, i) => `<div class="card paper a${i + 1}"><span class="tape ${tapes[i % 3]}"></span>${ri(t.icon)}<div><b>${esc(t.text)}</b>${t.sub ? `<small>${esc(t.sub)}</small>` : ''}</div></div>`).join('')}</div>`;
  L.append(el);
}

let lastSrc = '';
async function render(t) {
  const s = T.scenes.find(x => t >= x.start && t < x.start + x.dur) || T.scenes[T.scenes.length - 1];
  const lt = t - s.start, fade = clamp((s.dur - lt) / .3);
  for (const el of L.children) el.style.display = el.id === 'S-' + s.id ? 'block' : 'none';
  const el = document.getElementById('S-' + s.id);
  // staggered entrances .a0 .a1 … every 0.35 s (bullets: spread over the voice), .a9 last
  const vo = Array.isArray(s.vo) ? s.vo : [s.vo];
  el.querySelectorAll('[class*=" a"], [class^="a"]').forEach(n => {
    const m = n.className.match(/\ba(\d)\b/); if (!m) return;
    let d = m[1] === '9' ? 2.2 : (+m[1]) * .35;
    if (s.type === 'bullets' && m[1] !== '0') d = .6 + (+m[1] - 1) * Math.max(.4, (s.dur - 2.5) / 4);
    const k = ease((lt - d) / .5);
    const base = n.matches('.logo, .tiles, .url') ? 'translateX(-50%) ' : '';
    n.style.opacity = Math.min(k, fade); n.style.transform = `${base}translateY(${(1 - k) * 36}px)`;
  });
  const sw = el.querySelector('.sw'); if (sw) sw.style.transform = `scaleX(${ease((lt - .45) / .6)}) rotate(-.6deg)`;
  const ul = el.querySelector('svg.ul path'); if (ul) { ul.style.strokeDasharray = 1; ul.style.strokeDashoffset = 1 - ease((lt - .7) / .7); }
  if (s.type === 'shot') {
    const f = el.querySelector('.frame'), img = f.querySelector('img');
    const i = Math.min((s.frames || 1) - 1, Math.floor(lt * (s.fps || 15)));
    const src = `clips/${s.clip}/${String(i).padStart(4, '0')}.jpg`;
    if (src !== lastSrc) { img.src = src; lastSrc = src; await img.decode().catch(() => {}); }
    const k = ease(lt / .55); f.style.opacity = Math.min(k * 1.5, fade);
    f.style.transform = `rotate(${-.6 + .6 * (1 - k)}deg) scale(${(.95 + .05 * k) * (1 + .02 * lt / s.dur)})`;
  }
}
window.render = render;
</script>
</body>
</html>
